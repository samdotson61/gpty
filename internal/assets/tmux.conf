# ~/.tmux.conf — gpty / gmux (native Windows MSYS2 tmux, or system tmux on Unix)
# ---------------------------------------------------------------------------
# On Windows the default pane shell is PowerShell 7 (pwsh); MSYS2 bash is always
# one key away. A pane with no explicit command (e.g. pty_spawn with cmd empty,
# or a plain prefix-c new window) runs pwsh. Pass an explicit command for bash.
#
# Each pwsh pane first runs pane-init.ps1, which repairs the environment the
# cygwin/tmux round-trip breaks (PATHEXT, USERNAME, dropped PATH entries) so an
# agent in a pane can run `gpty ...` / `gmux ...` with no setup.
#
# `gpty setup` (or install.ps1) rewrites the placeholder below to the installed
# assets path. Installing by hand on Windows? Replace it with the path to
# pane-init.ps1, forward slashes, e.g. C:/Users/you/.gpty/pane-init.ps1
# On macOS/Linux this line is harmless if pwsh isn't installed — `gpty setup`
# comments it out so panes use your login shell.

set -g default-command "pwsh -NoLogo -NoExit -File @@GPTY@@/pane-init.ps1"

# Quality-of-life
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi

# --- truecolor for TUIs -----------------------------------------------------
# Advertise truecolor two ways (RGB terminal-feature + the older Tc override),
# allow passthrough, and enable the official tmux keys (extended-keys + extkeys)
# so Shift+Enter and notifications work for a nested Claude Code.
set  -as terminal-features ",*:RGB"
set  -as terminal-overrides ",*:Tc"
set  -g  allow-passthrough on
set  -s  extended-keys on
set  -as terminal-features ",*:extkeys"
set-environment -g COLORTERM truecolor
# NOTE on Claude Code colour/motion: Claude Code detects $TMUX and forces
# 256-colour + reduced-motion rendering REGARDLESS of COLORTERM / FORCE_COLOR /
# TERM. The fix is per-launch — hide $TMUX from the claude child, e.g.
#   pwsh -NoLogo -Command "Remove-Item Env:\TMUX,Env:\TERM -EA Ignore; claude"
# Then Claude Code renders full 24-bit truecolour, exactly as outside tmux.

# --- bash / pwsh on demand --------------------------------------------------
# prefix + P : new window running PowerShell 7
bind P new-window -n pwsh "pwsh -NoLogo"
# prefix + B : new window running an MSYS2 bash login shell
bind B new-window -n bash "bash -l"
# prefix + b : drop the CURRENT pane into bash (splits below)
bind b split-window -v "bash -l"
# prefix + | and prefix + - : split into bash (vertical / horizontal)
bind | split-window -h "bash -l"
bind - split-window -v "bash -l"

# Reload this config with prefix + R
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
